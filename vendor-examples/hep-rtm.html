<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cadence — Home Exercise &amp; RTM (example Comprehend app)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --brand: #0f766e; --brand-soft: #ecfdf5; --ink: #0f172a; --muted: #64748b; --line: #e5e7eb; --bg: #f6f8fa; --warn: #b45309; --warn-soft: #fffbeb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  nav { height: 52px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 18px; gap: 12px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; }
  .logo svg { width: 18px; height: 18px; }
  nav b { font-size: 16px; letter-spacing: -.01em; } nav small { color: var(--muted); }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
  .chip.on { border-color: #a7f3d0; background: var(--brand-soft); color: #065f46; } .chip.on .dot { background: #10b981; }
  .chip.err { border-color: #fecaca; background: #fef2f2; color: #991b1b; } .chip.err .dot { background: #ef4444; }
  /* No min-height tied to the viewport: inside Comprehend the frame is sized to this document's height, so
     a viewport-relative minimum would feed back into the measurement (frame → 100vh → doc → frame). */
  main { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  aside, section { min-width: 0; }   /* a 1fr track never shrinks below its item's min-content; the roster/table must not widen the page */
  html, body { overflow-x: hidden; }
  aside { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; }
  aside h4 { margin: 4px 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; }
  .pt:hover { background: #f1f5f9; } .pt.active { background: var(--brand-soft); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #334155; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .pt .meta { font-size: 11px; color: var(--muted); }
  .pt .adh { margin-left: auto; font-weight: 700; font-size: 12px; } .adh.low { color: #dc2626; } .adh.ok { color: #059669; }
  section { padding: 18px 22px 40px; max-width: 1080px; }
  .head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; } .head .sub { color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .tile b { display: block; font-size: 22px; margin-top: 4px; } .tile .trend { font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .card h3 { margin: 0; padding: 11px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card h3 .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; } tr:last-child td { border-bottom: 0; }
  .dose { color: var(--muted); font-size: 12px; }
  .week { display: inline-flex; gap: 3px; } .week i { width: 9px; height: 9px; border-radius: 2px; background: #e2e8f0; display: block; } .week i.d { background: var(--brand); }
  .flag { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin: 10px 14px; }
  .visit { padding: 12px 14px; }
  .visit .empty { color: var(--muted); font-size: 13px; padding: 10px 0 4px; }
  .visit .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .visit .row:last-child { border-bottom: 0; }
  .mark { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
  .mark.yes { background: #d1fae5; color: #065f46; } .mark.no { background: #f1f5f9; color: #94a3b8; } .mark.na { background: #f1f5f9; color: #cbd5e1; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; margin-top: 10px; } .kv span { color: var(--muted); }
  .change { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3730a3; margin: 2px 4px 2px 0; }
  details.dev { margin-top: 18px; font-size: 12px; color: var(--muted); }
  details.dev summary { cursor: pointer; } details.dev pre { background: #0f172a; color: #cbd5e1; border-radius: 8px; padding: 10px; max-height: 200px; overflow: auto; font-size: 11px; }

  /* ---- small widths (Comprehend's side panel is ~350px) ------------------------------- */
  @media (max-width: 720px) {
    nav { padding: 0 12px; gap: 8px; } nav small { display: none; } .chip { font-size: 11px; padding: 4px 8px; }
    main { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; }
    aside h4 { display: none; }
    #roster { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .pt { width: auto; flex: none; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 999px; }
    .pt .meta, .pt .adh { display: none; } .pt .avatar { width: 24px; height: 24px; font-size: 10px; }
    section { padding: 12px 12px 28px; }
    .head { flex-direction: column; align-items: flex-start; gap: 2px; } .head h1 { font-size: 18px; } .head .sub { font-size: 12px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; } .tile { padding: 10px 12px; } .tile b { font-size: 18px; }
    .grid { grid-template-columns: 1fr; }
    th:nth-child(2), td:nth-child(2) { display: none; }   /* dose column goes first */
    th, td { padding: 7px 10px; }
  }
  @media (max-width: 520px) {
    .tiles { grid-template-columns: 1fr; } .tile { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 12px; }
    .tile small { flex: 1 1 100%; font-size: 10px; } .tile b { font-size: 18px; margin: 0; } .tile .trend { font-size: 11px; }
    .week i { width: 7px; height: 7px; } th, td { padding: 6px 8px; font-size: 12px; }
    .card h3 { padding: 9px 12px; } .visit { padding: 10px 12px; } .flag { margin: 8px 10px; font-size: 12px; }
    .kv { grid-template-columns: 1fr; gap: 2px; } .kv span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 6px; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M12 40c6-16 10-16 16-4s10 12 16-4" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg></div>
  <b>Cadence</b><small>Home Exercise · Remote Therapeutic Monitoring</small>
  <span class="chip" id="chip"><span class="dot"></span><span id="chipText">Not connected to Comprehend</span></span>
  <a id="addToComprehend" class="chip" style="display:none;margin-left:8px;text-decoration:none;cursor:pointer" title="What a vendor puts on their own site: opens Admin Settings → Apps in Comprehend with this app looked up">+ Add to Comprehend</a>
</nav>
<main>
  <aside>
    <h4>Patients</h4>
    <div id="roster"></div>
  </aside>
  <section>
    <div id="content"></div>
    <details class="dev"><summary>Developer · Comprehend bridge log</summary><pre id="log"></pre></details>
  </section>
</main>

<!-- On your own site use the absolute URL: https://app.comprehendpt.com/comprehend.js
     The manifest this app would publish at /.well-known/comprehend-app.json: ./.well-known/hep-rtm.json -->
<script src="../comprehend.js"></script>
<script>
  // ---- Cadence's own world: a roster, each patient's program, adherence ------------------
  const ROSTER = [
    { id: 'C-1001', name: 'Ann Kim', dob: '1968-03-14', dx: 'R knee OA · post TKA wk 6', pt: 'M. Alvarez, PT', start: 'Aug 4', adherence: 71, sessions: 5, pain: [6, 5, 5, 4, 4, 3, 3], rtm: 14,
      flagged: 'Skipped Hip hinge 3× this week — reports knee pain during the movement.',
      program: [
        { name: 'Sit-to-stand',        dose: '3 × 12',        week: [1,1,0,1,1,1,0] },
        { name: 'Hip hinge',           dose: '3 × 10',        week: [1,0,0,1,0,0,0] },
        { name: 'Step-ups',            dose: '2 × 10 each',   week: [1,1,1,1,1,0,0] },
        { name: 'Glute bridge',        dose: '3 × 15',        week: [1,1,1,1,1,1,0] } ] },
    { id: 'C-1002', name: 'Bob Smith', dob: '1979-11-02', dx: 'L Achilles tendinopathy', pt: 'M. Alvarez, PT', start: 'Aug 18', adherence: 29, sessions: 2, pain: [4, 4, 5, 5, 5, 5, 5], rtm: 6,
      flagged: 'No sessions logged since Tuesday.',
      program: [
        { name: 'Heel raises',         dose: '3 × 15, slow', week: [1,1,0,0,0,0,0] },
        { name: 'Single-leg balance',  dose: '3 × 30 s',      week: [1,0,0,0,0,0,0] },
        { name: 'Ankle alphabet',      dose: '2 sets',        week: [1,1,0,0,0,0,0] } ] },
    { id: 'C-1003', name: 'Kate Nguyen', dob: '1991-07-22', dx: 'Non-specific LBP', pt: 'J. Ortiz, DPT', start: 'Jul 21', adherence: 100, sessions: 7, pain: [2, 2, 2, 1, 1, 1, 1], rtm: 22,
      flagged: '',
      program: [
        { name: 'Bird dog',            dose: '3 × 8 each',    week: [1,1,1,1,1,1,1] },
        { name: 'Dead bug',            dose: '3 × 10',        week: [1,1,1,1,1,1,1] },
        { name: 'Cat-camel',           dose: '2 × 10',        week: [1,1,1,1,1,1,1] } ] },
    { id: 'C-1004', name: 'Jacob Michalski', dob: '1990-05-17', dx: 'L shoulder impingement', pt: 'J. Ortiz, DPT', start: 'Aug 25', adherence: 86, sessions: 6, pain: [5,4,4,3,3,2,2], rtm: 18,
      flagged: '',
      program: [
        { name: 'Scapular wall slides', dose: '2 × 12', week: [1,1,1,0,1,1,1] },
        { name: 'Side-lying ER', dose: '3 × 10', week: [1,1,1,1,1,1,0] },
        { name: 'Prone Y raise', dose: '2 × 10', week: [1,1,0,1,1,1,1] },
        { name: 'Doorway pec stretch', dose: '3 × 30 s', week: [1,1,1,1,1,1,1] } ] },
    { id: 'C-1005', name: 'Priya Raman', dob: '1984-02-09', dx: 'Plantar fasciitis, R', pt: 'M. Alvarez, PT', start: 'Sep 1', adherence: 57, sessions: 4, pain: [7,6,6,6,5,5,5], rtm: 9,
      flagged: 'Calf raises skipped 3 days — “no time in the morning”.',
      program: [
        { name: 'Calf raises (eccentric)', dose: '3 × 15', week: [1,0,1,0,1,0,1] },
        { name: 'Plantar fascia stretch', dose: '3 × 30 s', week: [1,1,1,1,1,1,1] },
        { name: 'Towel curls', dose: '2 × 15', week: [1,1,0,0,1,0,0] } ] },
    { id: 'C-1006', name: 'Marcus Lee', dob: '1977-08-23', dx: 'Chronic LBP · flexion intolerant', pt: 'J. Ortiz, DPT', start: 'Jul 14', adherence: 100, sessions: 7, pain: [4,4,3,3,3,2,2], rtm: 31,
      flagged: '',
      program: [
        { name: 'McGill curl-up', dose: '3 × 8', week: [1,1,1,1,1,1,1] },
        { name: 'Side plank', dose: '3 × 20 s', week: [1,1,1,1,1,1,1] },
        { name: 'Bird dog', dose: '3 × 8 each', week: [1,1,1,1,1,1,1] },
        { name: 'Hip hinge', dose: '3 × 10', week: [1,1,1,1,1,1,1] } ] },
    { id: 'C-1007', name: 'Elena Petrova', dob: '1995-11-30', dx: 'ACL reconstruction · wk 10', pt: 'M. Alvarez, PT', start: 'Aug 11', adherence: 71, sessions: 5, pain: [2,2,3,2,2,1,1], rtm: 14,
      flagged: 'Reported swelling after step-downs on Thursday.',
      program: [
        { name: 'Step-downs', dose: '3 × 10 each', week: [1,1,1,1,0,1,0] },
        { name: 'Single-leg balance', dose: '3 × 30 s', week: [1,1,1,1,1,1,0] },
        { name: 'Leg press (light)', dose: '3 × 12', week: [1,1,0,1,0,1,0] },
        { name: 'Hamstring curl', dose: '3 × 12', week: [1,1,1,1,1,1,1] } ] },
    { id: 'C-1008', name: 'Darius Okafor', dob: '1969-06-12', dx: 'Rotator cuff repair · wk 8', pt: 'J. Ortiz, DPT', start: 'Jul 28', adherence: 43, sessions: 3, pain: [6,6,5,5,5,4,4], rtm: 7,
      flagged: 'Reports pain > 5/10 with ER band work; stopped on his own.',
      program: [
        { name: 'Pendulums', dose: '3 × 1 min', week: [1,1,1,0,0,0,0] },
        { name: 'Table slides', dose: '2 × 10', week: [1,1,0,0,1,0,0] },
        { name: 'ER with band', dose: '2 × 10', week: [1,0,0,0,0,0,0] } ] },
    { id: 'C-1009', name: 'Hannah Whitfield', dob: '2001-03-04', dx: 'Patellofemoral pain, bilateral', pt: 'M. Alvarez, PT', start: 'Sep 3', adherence: 100, sessions: 7, pain: [3,3,3,2,2,2,1], rtm: 12,
      flagged: '',
      program: [
        { name: 'Clamshells', dose: '3 × 15', week: [1,1,1,1,1,1,1] },
        { name: 'Wall sit', dose: '3 × 30 s', week: [1,1,1,1,1,1,1] },
        { name: 'Step-ups', dose: '2 × 10 each', week: [1,1,1,1,1,1,1] } ] },
    { id: 'C-1010', name: 'Grace Okonkwo', dob: '1958-09-21', dx: 'THA (anterior) · wk 4', pt: 'J. Ortiz, DPT', start: 'Aug 20', adherence: 83, sessions: 6, pain: [4,4,3,3,2,2,2], rtm: 16,
      flagged: '',
      program: [
        { name: 'Heel slides', dose: '3 × 10', week: [1,1,1,1,1,1,0] },
        { name: 'Standing hip abduction', dose: '2 × 10', week: [1,1,1,0,1,1,1] },
        { name: 'Sit-to-stand', dose: '3 × 8', week: [1,1,1,1,1,1,1] } ] },
  ];
  let current = null, unsubscribe = null, latest = null;   // latest = last answers from Comprehend, per patient id
  const $ = (id) => document.getElementById(id);
  const log = (m) => { $('log').textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + $('log').textContent; };
  const initials = (n) => n.split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
  const age = (dob) => Math.floor((Date.now() - new Date(dob)) / 3.15576e10);

  function renderRoster() {
    $('roster').innerHTML = ROSTER.map((p) => `
      <button class="pt ${current && current.id === p.id ? 'active' : ''}" data-id="${p.id}">
        <span class="avatar">${initials(p.name)}</span>
        <span><div>${p.name}</div><div class="meta">${p.dx}</div></span>
        <span class="adh ${p.adherence < 50 ? 'low' : 'ok'}">${p.adherence}%</span>
      </button>`).join('');
  }
  function renderChip() {
    const ours = comprehend.patient, chip = $('chip');
    if (!comprehend.ready) { chip.className = 'chip'; $('chipText').textContent = 'Not connected to Comprehend'; return; }
    if (!ours) { chip.className = 'chip'; $('chipText').textContent = 'Comprehend · no chart open'; return; }
    chip.className = 'chip on'; $('chipText').textContent = `Comprehend · ${ours.name}${ours.yourId ? ' · linked' : ''}`;
  }
  function renderVisit(p) {
    const a = latest && latest.patientId === (comprehend.patient && comprehend.patient.id) ? latest.answers : null;
    if (!a) return `<div class="empty">Comprehend fills this in from today's visit when the note is generated — which exercises were performed or reviewed, what changed, and what ${p.name.split(' ')[0]} said about the program.</div>`;
    const rows = p.program.map((ex) => { const v = a.performed ? a.performed[ex.name] : null;
      return `<div class="row"><span class="mark ${v === true ? 'yes' : v === false ? 'no' : 'na'}">${v === true ? '✓' : v === false ? '–' : '·'}</span>${ex.name}<span style="margin-left:auto;color:var(--muted);font-size:12px">${v === true ? 'performed / reviewed' : v === false ? 'not today' : '—'}</span></div>`; }).join('');
    const changes = (a.changes || []).map((c) => `<span class="change">${c.exercise || '?'} · ${c.change || ''}${c.dosage ? ' · ' + c.dosage : ''}</span>`).join('') || '<span style="color:var(--muted)">none stated</span>';
    return `${rows}<div class="kv"><span>Changes</span><div>${changes}</div><span>Patient reported</span><div>${a.adherence_report || '—'}</div><span>Pain today</span><div>${a.pain_today ?? '—'}${a.pain_today != null ? ' / 10' : ''}</div></div>`;
  }
  function render() {
    renderRoster(); renderChip();
    if (offer && !current) {
      $('content').innerHTML = `<div class="card" style="padding:16px 18px;max-width:520px"><h3 style="border:0;padding:0 0 6px;font-size:15px">${offer.name} isn't in Cadence yet</h3>
        <p style="margin:0 0 12px;color:var(--muted)">Comprehend has <b>${offer.name}</b>${offer.dob ? ` (DOB ${offer.dob})` : ''} open. Create them here to start a program — Comprehend links the two records on the first context you send.</p>
        <button id="createPt" style="background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer">Create ${offer.name.split(' ')[0]} in Cadence</button>
        <button id="pickPt" style="background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;margin-left:6px">Pick an existing patient</button></div>`;
      $('createPt').onclick = createFromComprehend; $('pickPt').onclick = () => { offer = null; render(); };
      return;
    }
    if (!current) { $('content').innerHTML = '<p style="color:var(--muted)">Select a patient.</p>'; return; }
    const p = current, last = p.pain[p.pain.length - 1], first = p.pain[0];
    $('content').innerHTML = `
      <div class="head"><h1>${p.name}</h1><div class="sub">${age(p.dob)} y · DOB ${p.dob} · ${p.dx} · ${p.pt} · program since ${p.start}</div></div>
      <div class="tiles">
        <div class="tile"><small>Adherence · 7 days</small><b>${p.adherence}%</b><span class="trend">${p.sessions} of 7 sessions</span></div>
        <div class="tile"><small>Pain · self-reported</small><b>${last} <span style="font-size:13px;color:var(--muted)">/ 10</span></b><span class="trend">${first} → ${last} this week</span></div>
        <div class="tile"><small>RTM minutes · month</small><b>${p.rtm} <span style="font-size:13px;color:var(--muted)">/ 20</span></b><span class="trend">${p.rtm >= 20 ? '98977 threshold met' : `${20 - p.rtm} to 98977 threshold`}</span></div>
        <div class="tile"><small>Next check-in</small><b>Today</b><span class="trend">in-clinic visit</span></div>
      </div>
      <div class="grid">
        <div class="card"><h3>Home program <span class="tag">last 7 days</span></h3>
          <table><thead><tr><th>Exercise</th><th>Dose</th><th>Week</th><th>Done</th></tr></thead><tbody>
          ${p.program.map((ex) => `<tr><td>${ex.name}</td><td class="dose">${ex.dose}</td><td><span class="week">${ex.week.map((d) => `<i class="${d ? 'd' : ''}"></i>`).join('')}</span></td><td>${ex.week.filter(Boolean).length}/7</td></tr>`).join('')}
          </tbody></table>
          ${p.flagged ? `<div class="flag">⚑ ${p.flagged}</div>` : ''}
        </div>
        <div class="card"><h3>In-clinic today <span class="tag">from Comprehend</span></h3><div class="visit">${renderVisit(p)}</div></div>
      </div>`;
  }
  $('roster').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; current = ROSTER.find((p) => p.id === b.dataset.id); offer = null; openChart(comprehend.patient); });

  // ---- Comprehend: one event, then per-patient context + questions ---------------------------
  const nameKey = (n) => String(n || '').toLowerCase().replace(/[^a-z ,]/g, '').split(/[ ,]+/).filter(Boolean).sort().join(' ');
  const byName = (name) => ROSTER.find((p) => nameKey(p.name) === nameKey(name)) || null;
  let offer = null;   // Comprehend's patient who isn't in Cadence yet → "create them?" banner
  comprehend.on('patient', (patient, { reason }) => {
    log(`patient(${reason}) → ${patient ? patient.name : 'none'}${patient && patient.yourId ? ' · linked ' + patient.yourId : ''}`);
    offer = null;
    if (patient) {
      const linked = patient.yourId && ROSTER.find((p) => p.id === patient.yourId);   // linked before: zero clicks
      current = linked || byName(patient.name) || null;                               // else open them by name
      if (!current) offer = { name: patient.name, dob: patient.dob };                 // not in Cadence: offer to create
    }
    // patient === null (visit has no patient yet): `current` stays whatever the user has open in Cadence;
    // sync() still calls setContext for them, which is what lets the clinician pull them onto the visit.
    openChart(patient);
  });
  // "Open the chart, and once it's up, tell Comprehend what you know." In a real app this is your
  // router + page-loaded hook; here render() is synchronous so the hook runs right after it.
  function openChart(patient) { render(); onChartLoaded(() => sync(patient)); }
  function onChartLoaded(fn) { setTimeout(fn, 0); }   // after render has committed (rAF would stall in a hidden tab)
  function createFromComprehend() {
    if (!offer) return;
    const id = 'C-' + (1000 + ROSTER.length + 1);
    ROSTER.push({ id, name: offer.name, dob: offer.dob || '—', dx: 'New patient', pt: '—', start: 'today', adherence: 0, sessions: 0, pain: [0], rtm: 0, flagged: '', program: [] });
    current = ROSTER[ROSTER.length - 1]; offer = null;
    log(`created ${current.name} (${id}) from Comprehend's chart`);
    openChart(comprehend.patient);
  }
  comprehend.on('error', ({ code }) => { $('chip').className = 'chip err'; $('chipText').textContent = `Comprehend · ${code.toLowerCase().replace('_', ' ')}`; log(`error ← ${code}`); });

  function sync(patient) {
    if (!current) return;   // nothing open in Cadence yet — nothing to say
    const p = current;
    // 1. Context: what Cadence knows about the patient we have open — the ONE call, whether or not
    //    Comprehend has a patient on the visit yet. With one it's also the link; without one the
    //    clinician can pull ours in from Comprehend.
    comprehend.setContext(`## Cadence — home program, last 7 days
- Adherence: ${p.adherence}% (${p.sessions}/7 sessions)
- Pain (self-reported): ${p.pain[0]} → ${p.pain[p.pain.length - 1]}
- RTM minutes this month: ${p.rtm}
- Program: ${p.program.map((e) => `${e.name} ${e.dose}`).join('; ')}
${p.flagged ? `- Flagged: ${p.flagged}` : ''}`, { id: p.id, name: p.name, dob: p.dob });
    log(`setContext → ${patient ? patient.id : '(no Comprehend patient yet)'} as "${p.name}" (${p.id})`);
    if (!patient) return;   // questions wait until the visit has a patient
    // 2. Questions built from THIS patient's program.
    if (unsubscribe) unsubscribe();
    const performed = {};
    performed._description = 'Only what was performed or reviewed in the room today';
    for (const ex of p.program) performed[ex.name] = { _type: 'boolean' };
    unsubscribe = comprehend.subscribe({
      ...(p.program.length ? { performed } : {}),                        // a brand-new patient has no program yet
      changes: [{ exercise: p.program.length ? { _choices: p.program.map((e) => e.name).concat(['(new exercise)']) } : 'exercise the PT named',
                  change:   { _choices: ['progressed', 'regressed', 'removed', 'added', 'kept'] },
                  dosage:   'sets x reps or time, if the PT stated one' }],
      adherence_report: 'what the patient said about doing the home program',
      pain_today:       { _type: 'integer', _description: 'pain reported today, 0-10, or null' },
    }, (answers, forPatient, meta) => {
      latest = { patientId: forPatient.id, answers };
      log(`answers ← v${meta.version}${meta.partial ? ' (partial)' : ''} for ${forPatient.name || forPatient.id}`);
      render();
    });
    log(`subscribe → ${p.program.length} exercise booleans + changes list for ${p.name}`);
  }
  // When opened as a page (not inside Comprehend's frame), show the vendor-site button for real.
  if (window.top === window) {
    const host = /^https:\/\/(app|dev)\.comprehendpt\.com$/.test(location.origin) ? location.origin : 'https://dev.comprehendpt.com';
    const a = $('addToComprehend');
    a.href = `${host}/User/apps?add=${encodeURIComponent(`${host}/vendor-examples/hep-rtm.html`)}&manifest=${encodeURIComponent(`${host}/vendor-examples/.well-known/hep-rtm.json`)}`;
    a.style.display = 'inline-flex';
  }
  render();
</script>
</body>
</html>
